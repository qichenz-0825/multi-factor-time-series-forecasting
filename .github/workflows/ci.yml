name: Tests and offline demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt && pip install -e '.[dev]'
      - run: ruff check . && pytest -q
      - run: forecasting demo --output reports/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-test
          path: reports/ci-demo/
      - run: docker build -t forecasting .
      - run: docker run --rm forecasting demo --output /tmp/demo
